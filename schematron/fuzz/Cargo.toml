[package]
name = "schematron-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.schematron]
path = ".."

[[bin]]
name = "fuzz_xml"
path = "fuzz_targets/fuzz_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_xpath"
path = "fuzz_targets/fuzz_xpath.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_schema"
path = "fuzz_targets/fuzz_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_validate"
path = "fuzz_targets/fuzz_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_streaming"
path = "fuzz_targets/fuzz_streaming.rs"
test = false
doc = false
bench = false

# RCA-ENF-4: a backstop. Any operator the lints miss panics, which is detectable,
# instead of wrapping, which is not. RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true
debug = 1

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
